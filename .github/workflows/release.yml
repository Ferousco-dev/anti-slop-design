name: Release

on:
  push:
    branches: [main]
    paths:
      - "CHANGELOG.md"
      - "skills/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate before releasing
        run: python3 scripts/validate_skill.py

      - name: Read version from CHANGELOG
        id: version
        run: |
          version=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          if [ -z "$version" ]; then
            echo "could not parse a version from CHANGELOG.md" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Skip if tag already exists
        id: check
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build bundle
        if: steps.check.outputs.exists == 'false'
        run: |
          mkdir -p dist
          cp LICENSE skills/anti-slop-design/
          (cd skills && zip -r "../dist/anti-slop-design-${{ steps.version.outputs.version }}.zip" anti-slop-design)

      - name: Extract release notes
        if: steps.check.outputs.exists == 'false'
        run: |
          awk '/^## \['"${{ steps.version.outputs.version }}"'\]/{flag=1;next}/^## \[/{flag=0}flag' \
            CHANGELOG.md > RELEASE_NOTES.md
          {
            echo ""
            echo "### Install"
            echo ""
            echo '```bash'
            echo 'curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | bash'
            echo '```'
            echo ""
            echo "Or download the \`.zip\` below and upload it in Claude under Settings → Capabilities → Skills."
          } >> RELEASE_NOTES.md

      - name: Publish release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            dist/*.zip
