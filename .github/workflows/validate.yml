name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill:
    name: Skill spec & budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SKILL.md frontmatter, budgets and links
        run: python3 scripts/validate_skill.py

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !**/node_modules/**

  links:
    name: External links
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --accept 200,206,429,403
            --exclude 'researchgate\.net' --exclude-path node_modules
            './**/*.md'
          fail: false

  shell:
    name: Installer script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck
        run: shellcheck install.sh
      - name: Smoke test installer
        run: bash install.sh --dest="$RUNNER_TEMP/skills" && test -f "$RUNNER_TEMP/skills/anti-slop-design/SKILL.md"
